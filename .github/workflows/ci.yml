---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install ansible, molecule and linters
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-lint ansible-core \
            'molecule>=6.0.3' 'molecule-plugins[docker]>=23.5.3'

      - name: Install the Open Liberty collection
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint
        run: |
          yamllint .
          ansible-lint

      - name: Run molecule test
        run: molecule test
